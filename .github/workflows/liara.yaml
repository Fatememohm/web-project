name: CD-Liara

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ گرفتن کد پروژه
      - uses: actions/checkout@v3

      # 2️⃣ نصب Node
      - uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 3️⃣ نصب Liara CLI و دیپلوی
      - name: Deploy to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npm i -g @liara/cli@9
          liara deploy --app="fatememohammadian" --api-token="$LIARA_TOKEN" --port=3000 --no-app-logs
